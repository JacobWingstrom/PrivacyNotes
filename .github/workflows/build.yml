name: Build IPA

on:
  push:
    branches: [main, hush-notes]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Hush.xcodeproj -target Hush -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -n 40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -n 50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Hush.app Payload/
          # Ad-hoc sign with entitlements so AltStore can set up the App Group for widgets.
          codesign -f -s - --entitlements Config/HushWidgets.entitlements Payload/Hush.app/PlugIns/HushWidgets.appex
          codesign -f -s - --entitlements Config/Hush.entitlements Payload/Hush.app
          zip -qry Hush.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-ipa
          path: Hush.ipa

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Hush.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Hush (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download Hush.ipa on your iPhone, then open it with AltStore."

  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator and capture screens
        run: ./scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Publish screenshots branch
        run: |
          cp -R shots /tmp/shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq .
          cp /tmp/shots/*.png .
          git add *.png
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -fq origin ci-screenshots
