name: Build check

# Compiles the app on feature branches without publishing a release.
on:
  push:
    branches: ["claude/**", "feature/**"]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Hush.xcodeproj -target Hush -configuration Debug -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -n 150; tail -n 40 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v "/DerivedData/" | sort -u | head -n 80 || true
