name: Hush
options:
  bundleIdPrefix: com.jacobwingstrom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Hush:
    type: application
    platform: iOS
    sources: [Hush]
    dependencies:
      - target: HushWidgets
    info:
      path: Config/Hush-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.jacobwingstrom.hush
            CFBundleURLSchemes: [hush]
        UIAppFonts:
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-Regular.ttf
          - FiraCode-Variable.ttf
          - IBMPlexMono-Bold.ttf
          - IBMPlexMono-BoldItalic.ttf
          - IBMPlexMono-Italic.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-SemiBold.ttf
          - Inter-Italic-Variable.ttf
          - Inter-Variable.ttf
          - JetBrainsMono-Italic-Variable.ttf
          - JetBrainsMono-Variable.ttf
          - Lora-Italic-Variable.ttf
          - Lora-Variable.ttf
          - SourceCodePro-Italic-Variable.ttf
          - SourceCodePro-Variable.ttf
          - SpaceMono-Bold.ttf
          - SpaceMono-Italic.ttf
          - SpaceMono-Regular.ttf
    entitlements:
      path: Config/Hush.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jacobwingstrom.hush]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobwingstrom.hush
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Midnight AppIcon-Forest AppIcon-Plum AppIcon-Paper AppIcon-Mono AppIcon-Spectrum AppIcon-Vampire AppIcon-Arctic AppIcon-OneDark AppIcon-Midnight2 AppIcon-Mocha AppIcon-Retro AppIcon-Solar"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hush
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Hush uses Face ID to unlock your notes."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Hush shows your iPhone calendars (including Outlook) in its Calendar. Nothing leaves your phone."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Hush shows your iPhone calendars (including Outlook) in its Calendar. Nothing leaves your phone."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Hush can import your reminders as tasks. Nothing leaves your phone."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Hush can import your reminders as tasks. Nothing leaves your phone."
        INFOPLIST_KEY_NSContactsUsageDescription: "Hush can import your contacts into its private Contacts. Nothing leaves your phone."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Hush imports the photos you pick into its encrypted Files, notes or Vault."
        INFOPLIST_KEY_NSCameraUsageDescription: "Hush uses the camera to scan documents. Scans stay encrypted on your iPhone."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Hush uses your location only to remind you about tasks when you arrive at or leave a place. It never leaves your phone."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Hush uses the microphone to record voice memos. Recordings stay encrypted on your iPhone."
        CODE_SIGNING_ALLOWED: NO
  HushWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Hush/Models
      - Hush/Shared
      - Hush/Security/Keychain.swift
      - Hush/Security/DataCrypto.swift
    info:
      path: Config/HushWidgets-Info.plist
      properties:
        CFBundleDisplayName: Hush
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/HushWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jacobwingstrom.hush]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobwingstrom.hush.widgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
